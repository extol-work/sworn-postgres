[workspace]
resolver = "2"
members = [
    "verify",
    "store",
    "api",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/extol-work/sworn-postgres"
rust-version = "1.88"

[workspace.dependencies]
# Signing / hashing primitives. Kept minimal on purpose: verify/ is meant to be
# embeddable elsewhere (Titania's browser UI via WASM, third-party bindings).
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
thiserror = "1"

# HTTP / async / DB stack. Standard modern Rust choices.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

# Internal crate wiring.
sworn-verify = { path = "verify" }
sworn-store = { path = "store" }
